   name: collect
   on:
     schedule:
       - cron: "17 * * * *"
     workflow_dispatch:
   permissions:
     contents: write
   jobs:
     collect:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - run: python3 collect.py
         - run: |
             git config user.name "dumbot"
             git config user.email "dumbot@users.noreply.github.com"
             git add events.json
             git diff --cached --quiet || git commit -m "wiki: update events"
             git push
